# Testes do motor e dos handlers + checagem de tipos e build do site, a cada push e pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Testes do motor, do catálogo, da negociação e das funções (sem IA)
        run: npm test

      - name: Custo da IA por semana de jogo (v1 x v2, meta de 80% menos)
        run: node scripts/custo-semana.ts

      - name: Instalar dependências do site
        working-directory: apps/web
        run: npm ci

      - name: Checar tipos
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build
