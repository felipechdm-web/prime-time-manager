# Publica as Edge Functions no Supabase e o site no GitHub Pages.
# Roda a cada push na branch main ou manualmente (Actions → Deploy → Run workflow).
#
# Precisa de (Settings → Secrets and variables → Actions):
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
#   Variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (a publishable/anon key é pública por natureza)
# A chave da Claude API NÃO entra aqui: ela fica só em Supabase → Edge Functions → Secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  functions:
    name: Edge Functions (Supabase)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Cadastre SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_REF em Settings > Secrets and variables > Actions (TUTORIAL.md, passo 6)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar as 7 funções
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  site:
    name: Site (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir variáveis
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL ou VITE_SUPABASE_ANON_KEY não cadastradas: o site sai em modo demonstração (sem nuvem e sem IA)."
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        working-directory: apps/web
        run: npm ci

      - name: Build
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
